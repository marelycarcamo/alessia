name: pruebas

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    name: Suite de pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar los módulos
        run: python -m compileall -q app src scripts

      - name: Ejecutar las pruebas
        env:
          # Las pruebas no realizan llamadas reales al proveedor LLM,
          # por lo que no se requieren credenciales.
          OPENROUTER_API_KEY: ""
        run: python -m pytest -q
